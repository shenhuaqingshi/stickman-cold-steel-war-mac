name: StickmanWar
options:
  bundleIdPrefix: com.stickmanwar
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "16.0"

settings:
  base:
    SDKROOT: macosx
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  StickmanWar:
    type: application
    platform: macOS
    sources:
      - path: StickmanWar
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stickmanwar.macos
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "火柴人冷兵器大战"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.strategy-games"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Stickman Cold Steel War. Pure Offline Native macOS."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: StickmanWar/StickmanWar.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  StickmanWarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StickmanWarTests
    dependencies:
      - target: StickmanWar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stickmanwar.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StickmanWar.app/Contents/MacOS/StickmanWar"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

schemes:
  StickmanWar:
    build:
      targets:
        StickmanWar: all
        StickmanWarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StickmanWarTests
    archive:
      config: Release
